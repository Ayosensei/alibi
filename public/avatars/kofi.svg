<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg_kofi" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2d2217" />
      <stop offset="100%" stop-color="#161009" />
    </radialGradient>
    <linearGradient id="rim_kofi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8c6d1d" />
    </linearGradient>
    <clipPath id="circleClip_kofi">
      <circle cx="64" cy="64" r="60" />
    </clipPath>
  </defs>

  <!-- Background Circle with Noir Gradient -->
  <circle cx="64" cy="64" r="62" fill="url(#bg_kofi)" />

  <!-- Clipped Portrait Illustration -->
  <g clip-path="url(#circleClip_kofi)">
    <!-- Victim Background Watermark -->
    

    <!-- Shoulders & Coat -->
    <path d="M 22 128 Q 22 100 48 94 L 80 94 Q 106 100 106 128 Z" fill="#2b2c34" />
    <!-- Collar / Shirt -->
    <polygon points="54,94 64,106 74,94" fill="#ede8df" />
    <polygon points="56,94 64,116 72,94" fill="#202228" opacity="0.4" />

    <!-- Neck -->
    <rect x="56" y="78" width="16" height="18" fill="#754b2e" />
    <path d="M 56 86 Q 64 92 72 86 Z" fill="#000" opacity="0.15" />

    <!-- Head / Face -->
    <ellipse cx="64" cy="66" rx="20" ry="24" fill="#754b2e" />

    <!-- Ears -->
    <circle cx="43" cy="66" r="4" fill="#754b2e" />
    <circle cx="85" cy="66" r="4" fill="#754b2e" />

    <!-- Hair -->
    
      <circle cx="44" cy="46" r="8" fill="#141211" />
      <circle cx="56" cy="40" r="8" fill="#141211" />
      <circle cx="68" cy="40" r="8" fill="#141211" />
      <circle cx="80" cy="46" r="8" fill="#141211" />
      <circle cx="84" cy="56" r="7" fill="#141211" />
      <circle cx="40" cy="56" r="7" fill="#141211" />
    
    
      <!-- Cap turned back -->
      <path d="M 36 48 Q 64 32 92 48 L 98 52 Q 64 42 30 52 Z" fill="#1e2024" />
      <path d="M 28 51 Q 18 56 12 55 Q 22 51 32 50 Z" fill="#141517" />
    

    <!-- Eyes (Subtle Noir Stylized) -->
    <ellipse cx="54" cy="66" rx="2.5" ry="1.8" fill="#1a1818" />
    <ellipse cx="74" cy="66" rx="2.5" ry="1.8" fill="#1a1818" />
    <!-- Eyebrows -->
    <path d="M 49 61 Q 54 59 59 61" stroke="#2a2420" stroke-width="1.5" fill="none" />
    <path d="M 69 61 Q 74 59 79 61" stroke="#2a2420" stroke-width="1.5" fill="none" />

    <!-- Nose -->
    <path d="M 64 64 L 62 72 L 66 72" stroke="#000" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.35" />

    <!-- Mouth -->
    <path d="M 58 78 Q 64 81 70 78" stroke="#7a423b" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Extra Accessories & Details -->
    
  </g>

  <!-- Outer Ring (Brass for suspects, Crimson for victims) -->
  <circle cx="64" cy="64" r="61" fill="none" stroke="url(#rim_kofi)" stroke-width="2" />
</svg>