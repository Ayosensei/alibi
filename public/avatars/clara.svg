<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg_clara" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#182234" />
      <stop offset="100%" stop-color="#0b111c" />
    </radialGradient>
    <linearGradient id="rim_clara" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8c6d1d" />
    </linearGradient>
    <clipPath id="circleClip_clara">
      <circle cx="64" cy="64" r="60" />
    </clipPath>
  </defs>

  <!-- Background Circle with Noir Gradient -->
  <circle cx="64" cy="64" r="62" fill="url(#bg_clara)" />

  <!-- Clipped Portrait Illustration -->
  <g clip-path="url(#circleClip_clara)">
    <!-- Victim Background Watermark -->
    

    <!-- Shoulders & Coat -->
    <path d="M 22 128 Q 22 100 48 94 L 80 94 Q 106 100 106 128 Z" fill="#1b263b" />
    <!-- Collar / Shirt -->
    <polygon points="54,94 64,106 74,94" fill="#ede8df" />
    <polygon points="56,94 64,116 72,94" fill="#202228" opacity="0.4" />

    <!-- Neck -->
    <rect x="56" y="78" width="16" height="18" fill="#d9b79e" />
    <path d="M 56 86 Q 64 92 72 86 Z" fill="#000" opacity="0.15" />

    <!-- Head / Face -->
    <ellipse cx="64" cy="66" rx="20" ry="24" fill="#d9b79e" />

    <!-- Ears -->
    <circle cx="43" cy="66" r="4" fill="#d9b79e" />
    <circle cx="85" cy="66" r="4" fill="#d9b79e" />

    <!-- Hair -->
    
    <!-- Default Hair -->
    <path d="M 38 62 Q 34 38 64 36 Q 94 38 90 62 Q 82 46 64 46 Q 46 46 38 62 Z" fill="#1d191b" />
  
    

    <!-- Eyes (Subtle Noir Stylized) -->
    <ellipse cx="54" cy="66" rx="2.5" ry="1.8" fill="#1a1818" />
    <ellipse cx="74" cy="66" rx="2.5" ry="1.8" fill="#1a1818" />
    <!-- Eyebrows -->
    <path d="M 49 61 Q 54 59 59 61" stroke="#2a2420" stroke-width="1.5" fill="none" />
    <path d="M 69 61 Q 74 59 79 61" stroke="#2a2420" stroke-width="1.5" fill="none" />

    <!-- Nose -->
    <path d="M 64 64 L 62 72 L 66 72" stroke="#000" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.35" />

    <!-- Mouth -->
    <path d="M 58 78 Q 64 81 70 78" stroke="#7a423b" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Extra Accessories & Details -->
    
  </g>

  <!-- Outer Ring (Brass for suspects, Crimson for victims) -->
  <circle cx="64" cy="64" r="61" fill="none" stroke="url(#rim_clara)" stroke-width="2" />
</svg>